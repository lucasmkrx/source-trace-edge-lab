name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-linux:
    name: C++ Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes ninja-build libsodium-dev libsqlite3-dev
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  cpp-coverage:
    name: C++ Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes ninja-build libsodium-dev libsqlite3-dev lcov
      - name: Configure
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
      - name: Generate coverage report
        run: |
          lcov --capture --directory build/coverage --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/fuzz/*' '*/_deps/*' --output-file coverage.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.info
          flags: cpp
          token: ${{ secrets.CODECOV_TOKEN }}

  cpp-macos:
    name: C++ macOS
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install native dependencies
        run: brew install ninja libsodium sqlite
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  sanitizers:
    name: Address and undefined-behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build libsodium-dev libsqlite3-dev
      - run: cmake --preset asan-ubsan
      - run: cmake --build --preset asan-ubsan
      - run: ctest --preset asan-ubsan

  python:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=sourcetrace_ingestion --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: services/ingestion/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

  typescript:
    name: TypeScript diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/diagnostics
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install simulator dependencies
        working-directory: .
        run: sudo apt-get update && sudo apt-get install --yes ninja-build libsodium-dev libsqlite3-dev
      - name: Build simulator for integration tests
        working-directory: .
        run: cmake --preset dev && cmake --build --preset dev --target sourcetrace_sim
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/diagnostics/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  showcase:
    name: Static reviewer showcase
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: node --test showcase/tests/*.test.mjs
