name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-linux:
    name: C++ Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes ninja-build libsodium-dev libsqlite3-dev
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  cpp-macos:
    name: C++ macOS
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native dependencies
        run: brew install ninja libsodium sqlite
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  sanitizers:
    name: Address and undefined-behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install --yes ninja-build libsodium-dev libsqlite3-dev
      - run: cmake --preset asan-ubsan
      - run: cmake --build --preset asan-ubsan
      - run: ctest --preset asan-ubsan

  python:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest

  typescript:
    name: TypeScript diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/diagnostics
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541dca151540d0c3c8bf8521edb478 # v4.0.3
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/diagnostics/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
