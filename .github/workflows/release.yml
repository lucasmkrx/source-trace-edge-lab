name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-cpp:
    name: Build C++ Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ninja-build libsodium-dev libsqlite3-dev
        
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libsodium sqlite
        
      - name: Configure
        run: cmake --preset dev
        
      - name: Build
        run: cmake --build --preset dev --target sourcetrace_sim
        
      - name: Archive Binary
        run: |
          mkdir -p release-artifact
          cp build/dev/sourcetrace_sim release-artifact/
          cd release-artifact && tar -czvf ../sourcetrace_sim-${{ runner.os }}.tar.gz sourcetrace_sim
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcetrace_sim-${{ runner.os }}
          path: sourcetrace_sim-${{ runner.os }}.tar.gz

  docker-ingestion:
    name: Build Ingestion Container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      
      - name: Log in to the Container registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/ingestion
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sourcetrace-ingestion:${{ github.ref_name }}

  publish-release:
    name: Publish Release
    needs: [build-cpp, docker-ingestion]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
